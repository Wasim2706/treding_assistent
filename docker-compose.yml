version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: trading_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: indian_trading_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: trading_redis
    restart: always
    ports:
      - "6379:6379"

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: trading_backend
    restart: always
    depends_on:
      - postgres
      - redis
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - PAPER_TRADING_ONLY=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/indian_trading_db
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}

  worker:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: trading_worker
    restart: always
    depends_on:
      - postgres
      - redis
    environment:
      - ENVIRONMENT=production
      - PAPER_TRADING_ONLY=true
      - DATABASE_URL=postgresql+asyncpg://postgres:postgrespassword@postgres:5432/indian_trading_db
      - REDIS_URL=redis://redis:6379/0
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - NEWS_API_KEY=${NEWS_API_KEY}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: trading_frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000

volumes:
  pgdata:
